<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTEL Maps - Trung tâm Khách hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="shared.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="gtel-sidebar"></div>

    <main class="main-content">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-black text-white tracking-tight">Quản lý Khách hàng</h1>
                <p class="text-gray-500 text-sm italic">Quản lý hồ sơ doanh nghiệp và kiểm soát hạn mức thanh toán.</p>
            </div>
            <button onclick="showToast('HỆ THỐNG', 'Chức năng thêm khách hàng mới đang được bảo trì.')" class="btn btn-primary px-8 py-4">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                Thêm doanh nghiệp
            </button>
        </header>

        <div class="card p-0 overflow-hidden shadow-2xl">
            <table class="matrix-table">
                <thead class="bg-[#0d1117]">
                    <tr>
                        <th>Tên doanh nghiệp & Mã số thuế</th>
                        <th>Hạn mức (Credit)</th>
                        <th>Trạng thái KYC</th>
                        <th class="text-right">Hành động</th>
                    </tr>
                </thead>
                <tbody id="customer-rows">
                    <!-- Sample Data -->
                    <tr class="hover:bg-white/[0.02]">
                        <td class="p-6">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-blue-600/10 flex items-center justify-center font-black text-blue-500 border border-blue-600/20">V</div>
                                <div>
                                    <p class="text-sm font-black text-white">Viettel Group</p>
                                    <p class="text-[10px] text-gray-500 font-mono">MST: 0100109106</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="space-y-1">
                                <p class="text-xs font-bold text-white">500,000,000đ</p>
                                <div class="w-24 h-1 bg-gray-800 rounded-full overflow-hidden">
                                    <div class="w-1/2 h-full bg-blue-500"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge badge-success">Đã xác minh</span>
                        </td>
                        <td class="text-right">
                            <div class="flex justify-end gap-2 px-6">
                                <button onclick="showToast('KYC', 'Đang xem hồ sơ pháp lý...')" class="btn btn-outline p-2 text-blue-500" title="Xác minh KYC">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                                </button>
                                <button onclick="showToast('CREDIT', 'Đang điều chỉnh hạn mức...')" class="btn btn-outline p-2 text-orange-500" title="Thiết lập hạn mức">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1v22M5 12h14"/></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr class="hover:bg-white/[0.02]">
                        <td class="p-6">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-purple-600/10 flex items-center justify-center font-black text-purple-500 border border-purple-600/20">F</div>
                                <div>
                                    <p class="text-sm font-black text-white">FPT Software</p>
                                    <p class="text-[10px] text-gray-500 font-mono">MST: 0101234321</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="space-y-1">
                                <p class="text-xs font-bold text-white">1,000,000,000đ</p>
                                <div class="w-24 h-1 bg-gray-800 rounded-full overflow-hidden">
                                    <div class="w-3/4 h-full bg-blue-500"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge badge-warning">Đang chờ duyệt</span>
                        </td>
                        <td class="text-right">
                            <div class="flex justify-end gap-2 px-6">
                                <button onclick="showToast('KYC', 'Hồ sơ đang được kiểm duyệt.')" class="btn btn-outline p-2 text-blue-500">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                                </button>
                                <button onclick="showToast('CREDIT', 'Hạn mức đã đạt tối đa.')" class="btn btn-outline p-2 text-orange-500">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1v22M5 12h14"/></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="shared.js"></script>
</body>
</html>
