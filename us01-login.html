<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>GTEL Maps Admin - Đăng nhập</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #1e293b, #020617); }
        .auth-card { background: var(--bg-card); width: 100%; max-width: 400px; padding: 40px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .auth-brand { text-align: center; margin-bottom: 32px; }
        .auth-brand i { font-size: 3rem; color: var(--primary); margin-bottom: 12px; }
        .auth-brand h2 { font-size: 1.5rem; font-weight: 800; }
        
        .otp-inputs { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .otp-inputs input { width: 45px; height: 50px; text-align: center; font-size: 1.25rem; font-weight: bold; background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 8px; color: var(--primary); }
    </style>
</head>
<body>
    <div id="login-step" class="auth-card">
        <div class="auth-brand">
            <i class="fas fa-satellite-dish"></i>
            <h2>GTEL MAPS ADMIN</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 8px;">Hệ thống Quản lý Hạ tầng bản đồ</p>
        </div>

        <div class="form-group">
            <label>Tên đăng nhập / Email</label>
            <input type="text" class="form-control" placeholder="admin@gtel.vn" id="user-email">
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <div style="position: relative;">
                <input type="password" class="form-control" value="password123" id="user-pass">
                <i class="fas fa-eye" style="position: absolute; right: 12px; top: 12px; color: var(--text-dim); cursor: pointer;" onclick="togglePass()"></i>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox"> Duy trì đăng nhập
            </label>
            <a href="#" style="color: var(--primary); text-decoration: none;">Quên mật khẩu?</a>
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; height: 48px;" onclick="goTo2FA()">
            TIẾP TỤC ĐĂNG NHẬP
        </button>
    </div>

    <div id="2fa-step" class="auth-card" style="display: none;">
        <div class="auth-brand">
            <i class="fas fa-shield-alt"></i>
            <h2>XÁC THỰC 2 LỚP</h2>
            <p style="color: var(--text-dim); font-size: 0.85rem; margin-top: 8px;">Vui lòng nhập mã OTP vừa được gửi đến email</p>
        </div>

        <div class="otp-inputs">
            <input type="text" maxlength="1" value="1">
            <input type="text" maxlength="1" value="2">
            <input type="text" maxlength="1" value="3">
            <input type="text" maxlength="1" value="">
            <input type="text" maxlength="1" value="">
            <input type="text" maxlength="1" value="">
        </div>

        <p style="text-align: center; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 24px;">
            Chưa nhận được mã? <a href="#" style="color: var(--primary); text-decoration: none;">Gửi lại sau 54s</a>
        </p>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; height: 48px;" onclick="location.href='dashboard.html'">
            XÁC NHẬN TRUY CẬP
        </button>
        
        <button class="btn btn-outline" style="width: 100%; justify-content: center; margin-top: 12px; border:none;" onclick="backToLogin()">
            Quay lại đăng nhập
        </button>
    </div>

    <script>
        function togglePass() {
            const p = document.getElementById('user-pass');
            p.type = p.type === 'password' ? 'text' : 'password';
        }
        function goTo2FA() {
            document.getElementById('login-step').style.display = 'none';
            document.getElementById('2fa-step').style.display = 'block';
        }
        function backToLogin() {
            document.getElementById('2fa-step').style.display = 'none';
            document.getElementById('login-step').style.display = 'block';
        }
    </script>
</body>
</html>
